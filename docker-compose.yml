services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workpaper
      POSTGRES_PASSWORD: workpaper
      POSTGRES_DB: workpaper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpaper"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://workpaper:workpaper@db:5432/workpaper
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
